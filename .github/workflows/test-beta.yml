name: Test Beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 31 1,3,5,7,8,10,12 *"
    - cron: "0 0 30 4,6,9,11 *"
    - cron: "0 0 28 2 *"

jobs:
  validate_beta:
    name: Validate Beta (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ha-beta
            python: "3.14"
            ha_channel: beta
            ha_version: beta

    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Install base test deps
        run: uv pip install --system -r requirements_test.txt
      - name: Install Home Assistant (${{ matrix.ha_version }})
        env:
          HA_CHANNEL: ${{ matrix.ha_channel }}
          HA_VERSION: ${{ matrix.ha_version }}
        run: |
          set -e
          echo "Channel: $HA_CHANNEL  Version: $HA_VERSION"
          uv pip install --system --pre homeassistant
          python -c "import importlib.metadata as m; print('Installed HA version:', m.version('homeassistant'))"
      - name: Run tests
        run: |
          pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -n auto \
            --cov custom_components.nodered \
            -o console_output_style=count \
            -p no:sugar \
            tests
